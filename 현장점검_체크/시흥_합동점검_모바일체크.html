<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시흥 합동점검 체크</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1e293b;--muted:#5f6b7a;--line:#d7dee8;--navy:#1f3a5f;--teal:#0e7c86;--amber:#fff4e0;--red:#c0392b;--green:#1e8e4e;--chip:#eef3f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#16212d;--ink:#e6edf5;--muted:#9fb0c3;--line:#2a3a4c;--navy:#0f2a47;--teal:#22a5b0;--amber:#3a2f1a;--chip:#1d2b3a}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#16212d;--ink:#e6edf5;--muted:#9fb0c3;--line:#2a3a4c;--navy:#0f2a47;--teal:#22a5b0;--amber:#3a2f1a;--chip:#1d2b3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;padding:12px 16px 10px}
header h1{font-size:18px;margin:0}
header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:6px;padding:8px 10px}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:18px;padding:8px 12px;font-size:14px;font-weight:600}
nav button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
nav button .p{font-size:11px;font-weight:500;opacity:.85;margin-left:4px}
main{padding:12px 12px 120px;max-width:760px;margin:0 auto}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 8px;color:var(--teal)}
.card h3{font-size:14.5px;margin:12px 0 6px}
.note{font-size:13px;color:var(--muted)}
.warn{background:var(--amber);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin:0 0 12px}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px dashed var(--line)}
label.ck:last-child{border-bottom:0}
label.ck input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;accent-color:var(--teal)}
label.ck small{display:block;color:var(--muted);font-size:12.5px}
.fld{margin:8px 0}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=datetime-local],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{min-height:76px;resize:vertical}
.cat textarea{border-left:5px solid var(--line)}
.cat.f textarea{border-left-color:var(--green)}.cat.s textarea{border-left-color:var(--teal)}.cat.e textarea{border-left-color:#d68910}.cat.u textarea{border-left-color:var(--red)}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{border:1px solid var(--line);border-radius:16px;padding:6px 10px;font-size:14px;background:var(--chip)}
.radios input{accent-color:var(--teal)}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1}
.btn{border:0;border-radius:8px;padding:10px 12px;font-size:14.5px;font-weight:700;background:var(--teal);color:#fff}
.btn.g{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.r{background:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px;white-space:nowrap}
.b-ok{background:#e8f6ee;color:var(--green)}.b-int{background:#fff1d6;color:#9a6200}.b-un{background:#fbeae8;color:var(--red)}
.photo{display:grid;grid-template-columns:52px 1fr;gap:6px;margin:6px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.photo input{font-size:15px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}
summary{font-weight:700;cursor:pointer}
#save{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:space-between;z-index:6}
#save .st{font-size:12.5px;color:var(--muted)}
@media print{nav,#save,.btns,.noprint{display:none!important}section.tab{display:block!important;page-break-after:always}body{background:#fff}}
</style>
</head>
<body>
<header>
  <h1>시흥시청 합동점검 · 무등록 정비 의심업체 확인</h1>
  <p>대한건설기계정비협회 지도팀 현장 지원용(비공식) · 양식 작성기준 2026.10.28. · 체크는 확인 완료 항목에만</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="save"><span class="st" id="st">입력 내용은 이 기기에 자동 저장됩니다</span><span><button class="btn g" onclick="go('out')">보내기</button></span></div>

<script>
const COMPANIES=[
 {id:'c1',short:'① 한글산업기계',name:'한글산업기계',type:'지게차',addr:'경기도 시흥시 마유로92번길 8, 시화공단 30바 117호 (정왕동)',
  extra:[
   ['h','지게차 — 건설기계에 해당하는지 (시행령 별표 1 제4호)'],
   ['타이어식이고 들어올림장치와 조종석이 있는지','이 조건을 갖추면 원칙적으로 건설기계'],
   ['전동식 + 솔리드타이어 + 도로가 아닌 장소에서만 운행하는지','세 조건이 모두 맞으면 제외. 도로 운행 여부는 진술과 관찰을 구분해 기록'],
   ['「농업기계화 촉진법」상 농업기계인지','2025.5.7. 개정으로 추가된 제외 사유. 이 날짜 전에 제작된 지게차는 종전 규정 적용(명판의 제작연월 기록)'],
   ['등록번호판과 명판(제조사·모델·제작번호·제작연월) 촬영·기록',''],
   ['h','등록돼 있다면 — 업종과 범위 (시행령 별표 2)'],
   ['종별 확인: 종합(지게차 또는 전기종) / 부분 / 전문(원동기·유압)','종합 "지게차" 업종은 지게차만 정비할 수 있음(비고 1)'],
   ['부분정비업이 원동기 분해(실린더헤드·피스톤·크랭크·연료펌프), 변속기 분해, 프레임 조정을 했는지','이 작업들은 부분업의 정비 범위에 없음. 범위를 넘었을 때의 제재는 시청이 판단(처분기준표에 해당 항목 없음)'],
   ['시화공단 호실의 사용 관계: 임차·전대, 다른 업체와 같이 쓰는지','등록 소재지와 실제 작업 장소가 같은지'],
  ]},
 {id:'c2',short:'② 오필승카센타',name:'오필승카센타',type:'DM(덤프·믹서로 추정)',addr:'경기도 시흥시 목감동 11-6',
  extra:[
   ['h','대상 차량 — 건설기계인지 자동차인지 (시행령 별표 1)'],
   ['"DM"이 덤프트럭·콘크리트믹서트럭을 뜻하는지 시청과 확인','이 양식에서는 덤프·믹서로 추정함(미확인)'],
   ['번호판 종류: 건설기계 번호판인지 자동차 번호판인지 · 등록증 확인',''],
   ['덤프트럭이면 적재용량 기록','12톤 이상이면 건설기계. 단, 12~20톤 미만으로 화물운송용 자동차로 등록된 것은 제외(제6호)'],
   ['콘크리트믹서트럭이면 혼합장치가 있는 자주식인지','건설기계(제14호)'],
   ['h','카센타의 등록 — 자동차정비업과 건설기계정비업은 별개'],
   ['자동차정비업 등록증만 있는지, 건설기계정비업(종합 "덤프 및 믹서" 등) 등록도 있는지','자동차정비업 등록만으로 건설기계 정비가 허용되지 않음'],
   ['자동차종합정비업자의 덤프·믹서 종합정비업 특례 해당 여부','시행규칙 제61조 단서는 등록기준을 인정해 주는 특례일 뿐, 건설기계정비업 등록 자체는 필요'],
   ['작업 부위: 원동기·변속기·차축·제동장치·프레임·적재함·혼합드럼','적재함 부분용접 등은 "소유자 자가정비" 범위에도 있음. 소유자가 직접 했는지 구분'],
  ]},
 {id:'c3',short:'③ 비에프중공업',name:'비에프중공업',type:'굴착기',addr:'경기도 시흥시 산현동 458 일원',
  extra:[
   ['h','굴착기 — 건설기계 해당 여부와 작업 장소'],
   ['자체중량 1톤 이상인지(명판·제원표)','1톤 미만 굴착기는 건설기계가 아님(별표 1 제2호)'],
   ['"458 일원"의 실제 작업 위치를 특정(지번·구역·야적장)','사업장 등록 소재지와 비교'],
   ['장비 소유자: 업체 소유(대여업 등) / 고객 소유 / 혼재','타인 장비를 맡아 정비했는지가 핵심'],
   ['h','자가정비 주장 시 (법 제16조의2 · 시행규칙 제41조 · 별표 10의2)'],
   ['소유·점유 증빙과 실제 작업자(직원인지 외부인인지)',''],
   ['용접기와 폐유수거시설을 갖췄는지','갖추면 버킷·배토판 등의 부분용접도 자가정비 범위에 포함. 범위를 넘으면 과태료 50만원 이하(시청 판단)'],
   ['h','작업 내용 (시행령 별표 2)'],
   ['트랙 롤러·링크·트랙슈 재생','종합(전기종·굴착기·기중기)만 가능한 항목'],
   ['출장(이동정비)이면 탈부착인지, 분해 정비인지','이동정비 탈부착에서는 분해 정비가 제외됨(비고 6). 사업장 밖 작업을 직접 금지하는 조문은 없음 → 위법이라고 단정하지 않음'],
   ['틸트 등 작업장치를 붙이고 떼는 작업인지, 가공·배관 작업이 있었는지','정비업에 해당하는지는 판단 보류. 시청에 질의 형태로 전달'],
   ['용접 중이거나 장치가 들려 있는 곳에는 접근하지 않음(안전)',''],
  ]},
];
const COMMON=[
 ['1','출입 전 역할과 안전',[
   ['시청 주관 담당자, 점검 근거, 대상, 요구 절차 확인',''],
   ['공무원 신분·권한 증표 제시 절차 협의','출입·검사·질문 권한은 시청 소속 공무원에게 있음(법 제35조제1항)'],
   ['협회는 자료 대조와 기술 설명을 지원한다고 역할 고지',''],
   ['안전모·안전화 등 보호구 확인',''],
 ]],
 ['2','등록 상태 확인 (시청과 대조)',[
   ['정비업등록증의 명의·번호·종별·주소 대조',''],
   ['시청 등록정보에서 변경·휴업·폐업·취소·정지 이력 확인','사업자등록증이나 회원증만으로 정비업 등록을 확인했다고 보지 않음'],
 ],'reg'],
 ['3','대상 기계와 실제 행위',[
   ['기계등록증·자동차등록증·명판·제원으로 대상 식별',''],
   ['번호판·모델·제작번호·소유자 기록',''],
   ['분해·조립·수리·가공·교체 구분',''],
   ['탈부착과 내부 분해 구분',''],
   ['사업장 작업과 출장 작업 구분',''],
   ['시행규칙 제1조의3 제외행위인지 대조','오일 보충 / 에어클리너엘리먼트·필터류 교환 / 배터리·전구 교환 / 타이어 점검·정비·트랙 장력 조정 / 창유리 교환 — "간단한 수리"로 넓혀 해석하지 않음'],
 ],'mach'],
 ['4','누가 영업하는지와 증빙',[
   ['수리를 의뢰받은 사람·업체',''],
   ['작업 지시자와 실제 작업자',''],
   ['견적·청구·대금을 받은 명의',''],
   ['하자 책임 주체',''],
   ['유상·무상, 반복 의뢰, 광고 여부',''],
   ['견적서·내역서·거래자료·광고·사진을 적법한 범위에서 확보','강제 제출 요구 금지. 업체가 스스로 보여 준 것만'],
   ['다른 업체 직원으로 등재돼 있거나 장소를 함께 쓰면, 실제 재직과 이번 영업 주체를 각각 확인',''],
 ]],
];
const ST={}; let STORE=null;
try{STORE=window.localStorage; STORE.setItem('_t','1'); STORE.removeItem('_t');}catch(e){STORE=null}
const KEY='siheung_insp_v1';
try{Object.assign(ST,JSON.parse((STORE&&STORE.getItem(KEY))||'{}'))}catch(e){}
let timer=null;
function persist(){ if(!STORE){document.getElementById('st').textContent='이 기기에서는 자동 저장이 안 됩니다 → [보내기]에서 파일로 저장하세요';return}
 clearTimeout(timer); timer=setTimeout(()=>{try{STORE.setItem(KEY,JSON.stringify(ST));document.getElementById('st').textContent='자동 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}catch(e){document.getElementById('st').textContent='저장 실패 → [보내기]에서 파일로 저장하세요'}},300)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ck(id,label,sub){return `<label class="ck"><input type="checkbox" data-k="${id}"><span>${esc(label)}${sub?`<small>${esc(sub)}</small>`:''}</span></label>`}
function tx(id,label,ph,area){return `<div class="fld"><span>${esc(label)}</span>${area?`<textarea data-k="${id}" placeholder="${esc(ph||'')}"></textarea>`:`<input type="text" data-k="${id}" placeholder="${esc(ph||'')}">`}</div>`}
function radios(id,opts){return `<div class="radios">${opts.map((o,i)=>`<label><input type="radio" name="${id}" data-k="${id}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`}
function companyHTML(c){
 let h=`<div class="card"><h2>${esc(c.name)} <span class="note">(${esc(c.type)})</span></h2>
  <div class="note">${esc(c.addr)}</div>
  <div class="fld"><span>점검 시작</span><div class="row"><input type="text" data-k="${c.id}_t0" placeholder="예: 10:05"><button class="btn g" onclick="nowTo('${c.id}_t0')">지금</button></div></div>
  ${tx(c.id+'_rep','대표·응대자(이름·직책)','')}
  ${tx(c.id+'_zone','실제 작업구역','예: 건물 뒤편 야외, 2번 피트')}
  ${tx(c.id+'_city','시청 담당·연락처','')}
  ${tx(c.id+'_ours','협회 참여자','')}
  </div>`;
 COMMON.forEach(([n,t,items,special])=>{
  h+=`<div class="card"><h2>${n}. ${esc(t)}</h2>`;
  items.forEach((it,i)=>h+=ck(`${c.id}_s${n}_${i}`,it[0],it[1]));
  if(special==='reg'){h+=`<h3>등록 상태</h3>`+radios(c.id+'_reg',['등록 확인','미제시·조회 대기','기관 확인 결과 등록 없음','취소·정지','추가 확인'])+tx(c.id+'_regsrc','확인 기관·담당·시각·자료','')}
  if(special==='mach'){h+=tx(c.id+'_mach','기종·식별(번호판·모델·제작번호)','')+tx(c.id+'_act','작업 부위·행위','')+tx(c.id+'_when','작업일·장소','')}
  h+=`</div>`;
 });
 h+=`<div class="card"><h2>현장 유형별 확인 — ${esc(c.type)}</h2>`;

function copyOut(){const t=buildText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('복사했습니다')).catch(()=>{const a=document.getElementById('outtxt');a.value=t;a.select();try{document.execCommand('copy');alert('복사했습니다')}catch(e){alert('길게 눌러 직접 복사하세요')}})}
function share(){const t=buildText();if(navigator.share){navigator.share({title:'시흥 합동점검 기록',text:t}).catch(()=>{})}else copyOut()}
function dl(){const b=new Blob([buildText()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='시흥_합동점검_기록_'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(a);a.click();a.remove()}
function resetAll(){if(!confirm('모든 입력을 지울까요? 되돌릴 수 없습니다.'))return;for(const k in ST)delete ST[k];try{STORE&&STORE.removeItem(KEY)}catch(e){}location.reload()}
let start='prep';try{start=(STORE&&STORE.getItem(KEY+'_tab'))||'prep'}catch(e){}
go(TABS.some(t=>t[0]===start)?start:'prep');
if(!STORE)document.getElementById('st').textContent='이 기기에서는 자동 저장이 안 됩니다 → [보내기]에서 파일로 저장하세요';
</script>
